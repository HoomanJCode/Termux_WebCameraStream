<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux Camera Stream</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <h2>📸 Camera Controls</h2>
            
            <div class="control-group">
                <label>Capture Mode:</label>
                <select id="captureMode">
                    <option value="termux">Termux Camera</option>
                    <option value="browser">Browser Camera</option>
                </select>
            </div>
            
            <!-- Termux Settings -->
            <div id="termuxSettings">
                <h3>Termux Camera Settings</h3>
                
                <div class="control-group">
                    <label>Camera ID:</label>
                    <select id="cameraId">
                        <option value="0">Camera 0 (Back)</option>
                        <option value="1">Camera 1 (Front)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>Resolution:</label>
                    <select id="resolution">
                        <option value="320x240">320x240</option>
                        <option value="640x480" selected>640x480</option>
                        <option value="800x600">800x600</option>
                        <option value="1280x720">1280x720 (HD)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>Quality: <span id="qualityLabel">80</span>%</label>
                    <input type="range" id="quality" min="10" max="100" value="80">
                </div>
                
                <div class="control-group">
                    <label>Zoom: <span id="zoomLabel">1.0</span>x</label>
                    <input type="range" id="zoom" min="1" max="5" step="0.1" value="1.0">
                </div>
                
                <div class="control-group">
                    <label>Rotation:</label>
                    <select id="rotation">
                        <option value="0">0°</option>
                        <option value="90">90°</option>
                        <option value="180">180°</option>
                        <option value="270">270°</option>
                    </select>
                </div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="mirrorH">
                    <label for="mirrorH">Mirror Horizontal</label>
                </div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="mirrorV">
                    <label for="mirrorV">Mirror Vertical</label>
                </div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="showTimestamp">
                    <label for="showTimestamp">Show Timestamp</label>
                </div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="showGrid">
                    <label for="showGrid">Show Grid</label>
                </div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="motionDetection">
                    <label for="motionDetection">Motion Detection</label>
                </div>
                
                <div class="control-group">
                    <label>Motion Threshold: <span id="thresholdLabel">30</span></label>
                    <input type="range" id="motionThreshold" min="5" max="100" value="30">
                </div>
            </div>
            
            <!-- Browser Settings -->
            <div id="browserSettings" style="display:none;">
				<h3>Browser Camera Settings</h3>
				
				<div class="control-group">
					<label>Resolution:</label>
					<select id="browserResolution">
						<option value="640x480">640x480 (4:3)</option>
						<option value="854x480">854x480 (16:9)</option>
						<option value="960x540">960x540 (16:9)</option>
						<option value="1280x720" selected>1280x720 (HD)</option>
						<option value="1920x1080">1920x1080 (Full HD)</option>
					</select>
				</div>
				
				<div class="control-group">
					<label>Quality: <span id="browserQualityLabel">50</span>%</label>
					<input type="range" id="browserQuality" min="10" max="100" value="50">
					<small style="color: #888;">Lower = faster FPS</small>
				</div>
				
				<div class="control-group">
					<label>Zoom: <span id="browserZoomLabel">1.0</span>x</label>
					<input type="range" id="browserZoom" min="1" max="5" step="0.1" value="1.0">
				</div>
				
				<div class="control-group">
					<label>Rotation:</label>
					<select id="browserRotation">
						<option value="0">0°</option>
						<option value="90">90°</option>
						<option value="180">180°</option>
						<option value="270">270°</option>
					</select>
				</div>
				
				<div class="control-group checkbox">
					<input type="checkbox" id="browserMirrorH">
					<label for="browserMirrorH">Mirror Horizontal</label>
				</div>
				
				<div class="control-group checkbox">
					<input type="checkbox" id="browserMirrorV">
					<label for="browserMirrorV">Mirror Vertical</label>
				</div>
			</div>
        </aside>
        
        <main class="main">
            <div class="stream-wrapper">
                <img id="stream" src="/stream" alt="Camera Stream">
                <div class="overlay">
                    <span id="fpsDisplay">FPS: 0</span>
                    <span id="captureModeDisplay">Mode: Termux</span>
                    <span id="motionAlert" style="display:none;">🔴 MOTION</span>
                    <span id="recIndicator" style="display:none;">⏺ REC</span>
                </div>
            </div>
            
            <div class="buttons">
                <button id="snapshotBtn">📷 Snapshot</button>
                <button id="burstBtn">📸 Burst (5)</button>
                <button id="recordBtn">⏺ Record</button>
                <button id="stopRecordBtn" style="display:none;">⏹ Stop</button>
                <button id="flashBtn">💡 Flash</button>
                <button id="fullscreenBtn">⛶ Fullscreen</button>
                <button id="themeBtn">🌓 Theme</button>
                <button id="downloadBtn">📦 Download ZIP</button>
            </div>
        </main>
    </div>
    
    <div id="toasts"></div>
    
    <script src="/script.js"></script>
</body>
</html>
