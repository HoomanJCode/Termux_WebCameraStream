<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: Arial, sans-serif;
        }
        .container { text-align: center; color: white; }
        video { width: 100%; max-width: 640px; border-radius: 10px; display: none; }
        canvas { display: none; }
        .status { margin-top: 20px; font-size: 18px; }
        .fps {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; z-index: 100; font-size: 20px;
        }
        .mode-badge {
            position: fixed; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; z-index: 100; font-size: 14px;
        }
        .mode-badge.active { background: #2ecc71; }
        .mode-badge.inactive { background: #e74c3c; }
        .mode-badge.waiting { background: #f39c12; }
    </style>
</head>
<body>
    <div class="fps" id="fps">FPS: 0</div>
    <div class="mode-badge waiting" id="modeBadge">WAITING</div>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="status" id="status">Connecting...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const fpsDisplay = document.getElementById('fps');
        const modeBadge = document.getElementById('modeBadge');
        
        let stream = null;
        let ws = null;
        let capturing = false;
        let shouldCapture = false;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let currentFps = 0;
        let currentQuality = 0.5;
        let statusPollInterval = null;
        
        const serverUrl = window.location.origin.replace('http', 'ws');
        
        function updateFPS() {
            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
                fpsDisplay.textContent = `FPS: ${currentFps}`;
            }
        }
        
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }
            
            try {
                ws = new WebSocket(serverUrl);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                    status.textContent = 'Connected';
                    status.style.color = '#2ecc71';
                    // Request current settings
                    ws.send(JSON.stringify({ type: 'get_settings' }));
                    // Check status immediately
                    checkStatus();
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'settings') {
                            if (data.settings.quality !== undefined) {
                                currentQuality = data.settings.quality / 100;
                                console.log('Quality updated:', currentQuality);
                            }
                        }
                        
                        if (data.type === 'mode_change') {
                            console.log('Mode change received:', data.mode);
                            shouldCapture = data.should_capture;
                            if (shouldCapture) {
                                startCapture();
                            } else {
                                stopCapture();
                            }
                            updateBadge();
                        }
                    } catch(e) {
                        console.error('Message parse error:', e);
                    }
                };
                
                ws.onerror = (e) => {
                    console.error('WebSocket error');
                    status.textContent = 'Connection error';
                    status.style.color = '#e74c3c';
                };
                
                ws.onclose = () => {
                    console.log('WebSocket closed, reconnecting...');
                    status.textContent = 'Reconnecting...';
                    status.style.color = '#e74c3c';
                    setTimeout(connectWebSocket, 2000);
                };
            } catch(e) {
                console.error('WebSocket connection error:', e);
                setTimeout(connectWebSocket, 2000);
            }
        }
        
        // Poll status every 2 seconds as backup
        function startStatusPoll() {
            if (statusPollInterval) clearInterval(statusPollInterval);
            statusPollInterval = setInterval(checkStatus, 2000);
        }
        
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                console.log('Status check:', data);
                
                const newShouldCapture = data.should_capture;
                
                if (newShouldCapture !== shouldCapture) {
                    shouldCapture = newShouldCapture;
                    console.log('Capture state changed:', shouldCapture);
                    
                    if (shouldCapture) {
                        await startCapture();
                    } else {
                        stopCapture();
                    }
                    updateBadge();
                }
            } catch(e) {
                console.error('Status check error:', e);
            }
        }
        
        function updateBadge() {
            if (capturing && shouldCapture) {
                modeBadge.textContent = 'STREAMING';
                modeBadge.className = 'mode-badge active';
            } else if (shouldCapture && !capturing) {
                modeBadge.textContent = 'STARTING...';
                modeBadge.className = 'mode-badge waiting';
            } else if (!shouldCapture && capturing) {
                modeBadge.textContent = 'STOPPING...';
                modeBadge.className = 'mode-badge waiting';
            } else {
                modeBadge.textContent = 'STOPPED';
                modeBadge.className = 'mode-badge inactive';
            }
        }
        
        async function startCapture() {
            if (capturing) {
                console.log('Already capturing');
                return;
            }
            
            console.log('Starting capture...');
            updateBadge();
            
            try {
                // Stop existing stream
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        console.log('Video ready:', canvas.width, 'x', canvas.height);
                        resolve();
                    };
                });
                
                capturing = true;
                updateBadge();
                status.textContent = 'Streaming...';
                status.style.color = '#2ecc71';
                
                // Start capture loop
                requestAnimationFrame(captureFrame);
                
            } catch (err) {
                console.error('Camera error:', err);
                status.textContent = 'Camera error: ' + err.message;
                status.style.color = '#e74c3c';
                capturing = false;
                shouldCapture = false;
                updateBadge();
            }
        }
        
        function stopCapture() {
            console.log('Stopping capture...');
            capturing = false;
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.style.display = 'none';
            updateBadge();
            status.textContent = 'Stopped';
            status.style.color = '#888';
        }
        
        function captureFrame() {
            if (!capturing || !shouldCapture) {
                if (capturing && !shouldCapture) {
                    stopCapture();
                }
                return;
            }
            
            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const jpegData = canvas.toDataURL('image/jpeg', currentQuality);
                const base64Data = jpegData.split(',')[1];
                
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(bytes);
                }
                
                updateFPS();
                
            } catch (err) {
                console.error('Capture error:', err);
            }
            
            if (capturing && shouldCapture) {
                requestAnimationFrame(captureFrame);
            }
        }
        
        // Initialize
        console.log('Initializing capture page...');
        connectWebSocket();
        startStatusPoll();
        checkStatus();
    </script>
</body>
</html>
