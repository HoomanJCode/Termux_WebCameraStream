<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: Arial, sans-serif;
        }
        .container { text-align: center; color: white; }
        video { width: 100%; max-width: 640px; border-radius: 10px; display: none; }
        canvas { display: none; }
        .status { margin-top: 20px; font-size: 18px; }
        .fps {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; z-index: 100; font-size: 20px;
        }
        .mode-badge {
            position: fixed; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; z-index: 100; font-size: 14px;
        }
        .mode-badge.active { background: #2ecc71; }
        .mode-badge.inactive { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="fps" id="fps">FPS: 0</div>
    <div class="mode-badge inactive" id="modeBadge">STOPPED</div>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="status" id="status">Connecting...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const fpsDisplay = document.getElementById('fps');
        const modeBadge = document.getElementById('modeBadge');
        
        let stream = null;
        let ws = null;
        let capturing = false;
        let shouldCapture = false;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let currentFps = 0;
        let currentQuality = 0.5;
        
        const serverUrl = window.location.origin.replace('http', 'ws');
        
        function updateFPS() {
            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
                fpsDisplay.textContent = `FPS: ${currentFps}`;
            }
        }
        
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }
            
            ws = new WebSocket(serverUrl);
            
            ws.onopen = () => {
                status.textContent = 'Connected';
                status.style.color = '#2ecc71';
                // Request current settings
                ws.send(JSON.stringify({ type: 'get_settings' }));
                // Check if we should be capturing
                checkStatus();
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'settings') {
                        // Update quality from server settings
                        if (data.settings.quality !== undefined) {
                            currentQuality = data.settings.quality / 100;
                            console.log('Quality updated:', currentQuality);
                        }
                    }
                    
                    if (data.type === 'mode_change') {
                        shouldCapture = data.should_capture;
                        if (shouldCapture) {
                            startCapture();
                        } else {
                            stopCapture();
                        }
                        updateBadge();
                    }
                } catch(e) {}
            };
            
            ws.onerror = () => {
                status.textContent = 'Connection error - retrying...';
                status.style.color = '#e74c3c';
                setTimeout(connectWebSocket, 2000);
            };
            
            ws.onclose = () => {
                status.textContent = 'Disconnected - retrying...';
                status.style.color = '#e74c3c';
                setTimeout(connectWebSocket, 2000);
            };
        }
        
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                shouldCapture = data.should_capture;
                if (shouldCapture) {
                    startCapture();
                }
                updateBadge();
            } catch(e) {
                console.error('Status check error:', e);
            }
        }
        
        function updateBadge() {
            if (shouldCapture && capturing) {
                modeBadge.textContent = 'STREAMING';
                modeBadge.className = 'mode-badge active';
            } else if (shouldCapture) {
                modeBadge.textContent = 'STARTING...';
                modeBadge.className = 'mode-badge inactive';
            } else {
                modeBadge.textContent = 'STOPPED';
                modeBadge.className = 'mode-badge inactive';
            }
        }
        
        async function startCapture() {
            if (capturing) return;
            
            try {
                // Stop existing stream if any
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
                
                capturing = true;
                updateBadge();
                status.textContent = 'Streaming...';
                status.style.color = '#2ecc71';
                
                // Start capture loop
                requestAnimationFrame(captureFrame);
                
            } catch (err) {
                console.error('Camera error:', err);
                status.textContent = 'Camera error: ' + err.message;
                status.style.color = '#e74c3c';
                capturing = false;
                shouldCapture = false;
                updateBadge();
            }
        }
        
        function stopCapture() {
            capturing = false;
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.style.display = 'none';
            updateBadge();
            status.textContent = 'Stopped';
            status.style.color = '#888';
        }
        
        function captureFrame() {
            if (!capturing || !shouldCapture) {
                // Stop if we shouldn't be capturing
                if (capturing) stopCapture();
                return;
            }
            
            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Use quality from server settings
                const jpegData = canvas.toDataURL('image/jpeg', currentQuality);
                const base64Data = jpegData.split(',')[1];
                
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(bytes);
                }
                
                updateFPS();
                
            } catch (err) {
                console.error('Capture error:', err);
            }
            
            if (capturing && shouldCapture) {
                requestAnimationFrame(captureFrame);
            }
        }
        
        // Start connection
        connectWebSocket();
    </script>
</body>
</html>
