<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: Arial, sans-serif;
        }
        .container { text-align: center; color: white; }
        video { display: none; }
        canvas { display: none; }
        .status { margin-top: 20px; font-size: 18px; }
        .info-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; z-index: 100;
        }
        .fps {
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; font-size: 20px;
        }
        .settings-info {
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; font-size: 12px;
            text-align: right; max-width: 220px;
        }
        .mode-badge {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 5px; z-index: 100; font-size: 14px;
        }
        .mode-badge.active { background: #2ecc71; color: white; }
        .mode-badge.inactive { background: #e74c3c; color: white; }
        .mode-badge.waiting { background: #f39c12; color: white; }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="fps" id="fps">FPS: 0</div>
        <div class="settings-info" id="settingsInfo">Loading...</div>
    </div>
    <div class="mode-badge waiting" id="modeBadge">WAITING</div>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="status" id="status">Connecting...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const fpsDisplay = document.getElementById('fps');
        const modeBadge = document.getElementById('modeBadge');
        const settingsInfo = document.getElementById('settingsInfo');
        
        let stream = null;
        let ws = null;
        let capturing = false;
        let shouldCapture = false;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let currentFps = 0;
        let statusPollInterval = null;
        
        let currentSettings = {
            quality: 50,
            width: 1280,
            height: 720,
            rotation: 0,
            zoom: 1.0,
            mirror_h: false,
            mirror_v: false
        };
        
        const serverUrl = window.location.origin.replace('http', 'ws');
        
        function updateSettingsDisplay() {
            const s = currentSettings;
            settingsInfo.textContent = 
                `Q:${s.quality}% | ${s.width}x${s.height}\n` +
                `Rot:${s.rotation}° | Zoom:${s.zoom.toFixed(1)}x` +
                (s.mirror_h ? ' | H' : '') +
                (s.mirror_v ? ' | V' : '');
        }
        
        function updateFPS() {
            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
                fpsDisplay.textContent = `FPS: ${currentFps}`;
            }
        }
        
        function connectWebSocket() {
            if (ws) { ws.close(); ws = null; }
            
            try {
                ws = new WebSocket(serverUrl);
                
                ws.onopen = () => {
                    status.textContent = 'Connected';
                    status.style.color = '#2ecc71';
                    ws.send(JSON.stringify({ type: 'get_settings' }));
                    checkStatus();
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'settings') {
                            updateSettingsFromServer(data.settings);
                        }
                        
                        if (data.type === 'mode_change') {
                            shouldCapture = data.should_capture;
                            if (shouldCapture) startCapture();
                            else stopCapture();
                            updateBadge();
                        }
                    } catch(e) {}
                };
                
                ws.onerror = () => {
                    status.textContent = 'Error - retrying...';
                    status.style.color = '#e74c3c';
                };
                
                ws.onclose = () => {
                    status.textContent = 'Reconnecting...';
                    status.style.color = '#e74c3c';
                    setTimeout(connectWebSocket, 2000);
                };
            } catch(e) {
                setTimeout(connectWebSocket, 2000);
            }
        }
        
        function updateSettingsFromServer(settings) {
            if (!settings) return;
            
            if (settings.quality !== undefined) currentSettings.quality = parseInt(settings.quality);
            if (settings.width !== undefined) currentSettings.width = parseInt(settings.width);
            if (settings.height !== undefined) currentSettings.height = parseInt(settings.height);
            if (settings.rotation !== undefined) currentSettings.rotation = parseInt(settings.rotation);
            if (settings.zoom !== undefined) currentSettings.zoom = parseFloat(settings.zoom);
            if (settings.mirror_h !== undefined) currentSettings.mirror_h = settings.mirror_h;
            if (settings.mirror_v !== undefined) currentSettings.mirror_v = settings.mirror_v;
            
            updateSettingsDisplay();
        }
        
        function startStatusPoll() {
            if (statusPollInterval) clearInterval(statusPollInterval);
            statusPollInterval = setInterval(checkStatus, 2000);
        }
        
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.browser_settings) {
                    updateSettingsFromServer(data.browser_settings);
                }
                
                if (data.should_capture !== shouldCapture) {
                    shouldCapture = data.should_capture;
                    if (shouldCapture) await startCapture();
                    else stopCapture();
                    updateBadge();
                }
            } catch(e) {}
        }
        
        function updateBadge() {
            if (capturing && shouldCapture) {
                modeBadge.textContent = 'STREAMING';
                modeBadge.className = 'mode-badge active';
            } else if (shouldCapture && !capturing) {
                modeBadge.textContent = 'STARTING...';
                modeBadge.className = 'mode-badge waiting';
            } else if (!shouldCapture && capturing) {
                modeBadge.textContent = 'STOPPING...';
                modeBadge.className = 'mode-badge waiting';
            } else {
                modeBadge.textContent = 'STOPPED';
                modeBadge.className = 'mode-badge inactive';
            }
        }
        
        async function startCapture() {
            if (capturing && stream) return;
            
            updateBadge();
            
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                
                // Always use back camera
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: currentSettings.width },
                        height: { ideal: currentSettings.height },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        // Set canvas dimensions once
                        canvas.width = currentSettings.width;
                        canvas.height = currentSettings.height;
                        // Wait until video actually has data
                        if (video.readyState >= 2) {
                            resolve();
                        } else {
                            video.oncanplay = resolve;
                        }
                    };
                });
                
                capturing = true;
                updateBadge();
                status.textContent = 'Streaming...';
                status.style.color = '#2ecc71';
                
                captureFrame();
                
            } catch (err) {
                console.error('Camera error:', err);
                status.textContent = 'Error: ' + err.message;
                status.style.color = '#e74c3c';
                capturing = false;
                shouldCapture = false;
                updateBadge();
            }
        }
        
        function stopCapture() {
            capturing = false;
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            updateBadge();
            status.textContent = 'Stopped';
            status.style.color = '#888';
        }
        
        function captureFrame() {
            if (!capturing || !shouldCapture || !stream) {
                if (capturing) stopCapture();
                return;
            }
            
            // Don't draw if video isn't ready
            if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                setTimeout(captureFrame, 30);
                return;
            }
            
            try {
                // Resize canvas only when settings change
                if (canvas.width !== currentSettings.width || 
                    canvas.height !== currentSettings.height) {
                    canvas.width = currentSettings.width;
                    canvas.height = currentSettings.height;
                }
                
                // Reset transform completely
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                
                // **Crucial: Do not clear the canvas**
                // We will draw the video frame large enough to cover the whole canvas,
                // even with rotation/zoom. This prevents any black flash.
                
                // Move to center
                ctx.translate(canvas.width / 2, canvas.height / 2);
                
                // Apply rotation
                if (currentSettings.rotation !== 0) {
                    ctx.rotate((currentSettings.rotation * Math.PI) / 180);
                }
                
                // Apply mirror and zoom
                let scaleX = currentSettings.zoom;
                let scaleY = currentSettings.zoom;
                if (currentSettings.mirror_h) scaleX *= -1;
                if (currentSettings.mirror_v) scaleY *= -1;
                ctx.scale(scaleX, scaleY);
                
                // Calculate the size needed to cover the entire canvas after rotation
                // (diagonal of the canvas divided by zoom essentially)
                const diagonal = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
                let coverSize = diagonal / currentSettings.zoom;
                
                const vidW = video.videoWidth;
                const vidH = video.videoHeight;
                const videoRatio = vidW / vidH;
                
                let drawW, drawH;
                if (canvas.width / canvas.height > videoRatio) {
                    drawW = coverSize;
                    drawH = coverSize / videoRatio;
                } else {
                    drawH = coverSize;
                    drawW = coverSize * videoRatio;
                }
                
                // Draw the video frame centered, large enough to cover the canvas
                ctx.drawImage(video, -drawW/2, -drawH/2, drawW, drawH);
                
                // Restore context (reset transform)
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                
                // Encode with quality
                const quality = currentSettings.quality / 100;
                const jpegData = canvas.toDataURL('image/jpeg', quality);
                const base64Data = jpegData.split(',')[1];
                
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(bytes);
                }
                
                updateFPS();
                
            } catch (err) {
                console.error('Frame error:', err);
            }
            
            if (capturing && shouldCapture) {
                setTimeout(captureFrame, 10);
            }
        }
        
        // Initialize
        connectWebSocket();
        startStatusPoll();
        checkStatus();
        updateSettingsDisplay();
    </script>
</body>
</html>
